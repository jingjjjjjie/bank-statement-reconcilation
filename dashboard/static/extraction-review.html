<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review extraction</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/extraction-review.css">
<script src="/common.js" defer></script><script src="/office-view.js" defer></script>
<script src="/extraction-review.js" defer></script><script src="/receipts.js" defer></script>
</head><body class="extraction-workspace">
<main>
<header class="review-header"><div class="review-title"><a href="/documents" aria-label="Back to document status">← Documents</a><span class="header-divider"></span><h1>Review extraction</h1><span id="review-progress" class="review-progress"></span></div><div class="review-header-actions"><label for="receipt-reviewer">Reviewer</label><input id="receipt-reviewer" autocomplete="name" placeholder="Your name"><button id="reload-receipts" class="button secondary" type="button" title="Load latest saved results">Reload</button></div></header>
<section class="document-switcher" aria-label="Document navigation"><div class="document-choice"><label for="receipt-unit">DOCUMENT / PAGE</label><select id="receipt-unit" aria-label="Document / page"></select></div><div class="document-navigation"><button id="previous-document" type="button" aria-label="Previous document">←</button><span id="document-position">0 / 0</span><button id="next-document" type="button" aria-label="Next document">→</button></div></section>
<div class="extraction-layout">
<section class="extraction-original" aria-label="Original document"><div class="preview-toolbar"><span class="pane-label">ORIGINAL</span><strong id="original-name">Choose a document</strong><a id="receipt-original" target="_blank" rel="noopener" title="Open original document">Open original ↗</a></div><div id="original-viewport"><div id="original-preview"></div></div><div class="viewer-footer"><label>Page / sheet <select id="original-page"></select></label><label>Zoom <select id="original-zoom"><option value="1">Fit page</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><span id="original-status" role="status"></span></div></section>
<section class="extraction-editor" id="receipt-review-panel"><div class="editor-heading"><div><span class="pane-label">EXTRACTED DETAILS</span><h2>Check each piece</h2></div><span id="piece-count" class="piece-count">0 pieces</span></div><p class="editor-help">Compare with the original. Leave missing fields blank.</p><p id="receipt-error" class="validation" role="alert" hidden></p><div id="piece-tabs" class="piece-tabs" aria-label="Receipt pieces"></div><p id="receipt-unit-status" role="status"></p>
<form id="receipt-form"><div id="receipt-pieces"></div><div class="editor-footer"><button id="add-receipt" class="button secondary" type="button">+ Add piece</button><button id="accept-receipts" class="button dark" type="submit">Accept &amp; next →</button></div></form>
</section></div></main><div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
