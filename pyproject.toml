# Editable installation keeps Python imports stable with the src/ layout.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-statement-reconciliation"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/dashboard/frontend", "src/dashboard/.data"]

[tool.ruff.format]
quote-style = "preserve"      # Mixed quote styles are kept; new code prefers double quotes.

[tool.ruff.lint]
# Pyflakes, pycodestyle, bugbear, simplifications, docstring presence, import sorting (I).
select = ["F", "E", "W", "B", "SIM", "D1", "I"]
# E501: the formatter owns line length. SIM1xx: nested or compact forms are fine when clearer.
# B905: adding zip(strict=True) would change behaviour; decide per call when editing it.
ignore = ["E501", "D105", "D107", "SIM105", "SIM108", "SIM117", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "B023"]   # Test names describe behaviour; closures run inside the same loop pass.
"scripts/**" = ["B023"]        # Benchmark closures are called within the loop that defines them.
"**/__init__.py" = ["D104"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["reconciliation", "dashboard", "scripts", "tests"]
combine-as-imports = true
