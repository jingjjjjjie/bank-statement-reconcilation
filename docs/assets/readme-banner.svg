<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Accounting Copilot — A little less paperwork.</title>
  <desc id="desc">A pastel blue and lavender banner with a smiling receipt, a green checkmark and the words Bank Statement Reconciliation.</desc>
