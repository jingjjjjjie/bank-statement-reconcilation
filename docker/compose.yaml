services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${DOCKER_TARGET:-development}
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.160.0}
    init: true
    command: ["python", "-m", "dashboard.app", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-8765}:8765"
    environment:
      PYTHONPATH: /workspace/src:/workspace
      DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:-}
    volumes:
      - .:/workspace
      - "${DOCUMENTS_PATH:-./uploads}:/documents"
      - "${UPLOADS_PATH:-./uploads}:/uploads"
      - codex-home:/home/app/.codex
    restart: unless-stopped

volumes:
  codex-home:
